networks:
  proxy_net:
    external: true
    name: proxy_net          # nginx 所在网络
  data_net:
    external: true
    name: data_net           # mysql / redis 所在网络

# 镜像不给默认值：服务器上由 deploy/deploy.sh 设成本次提交 SHA 标记的镜像，没设就直接报错，
# 不会悄悄起一个不知道是哪个提交的版本。本地开发在 .env 里设成本地标签（如 crm_os-backend:local）再 build。
services:
  backend:
    image: ${CRM_BACKEND_IMAGE:?set by deploy/deploy.sh to the commit-tagged image}
    build: ./backend         # 本地 docker compose build 时用；服务器上 deploy.sh 用 --no-build
    env_file: .env
    environment:
      - INSTANCE_ID=backend
      - DB_HOST=infra_mysql
      - REDIS_URL=redis://infra_redis:6379/0
    networks: [proxy_net, data_net]
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ${CRM_FRONTEND_IMAGE:?set by deploy/deploy.sh to the commit-tagged image}
    build: ./frontend
    networks: [proxy_net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/index.html"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
